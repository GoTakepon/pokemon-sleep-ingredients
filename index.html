<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>食材管理ツール</title>
  <style>
    @layer reset, base, sections, overrides;
  </style>
  <link rel="stylesheet" href="./assets/css/base.css?v=20251023-0727">
  <link rel="stylesheet" href="./assets/css/section-ocr.css?v=20251023-0727">
  <link rel="stylesheet" href="./assets/css/section-goal.css?v=20251023-0727">
  <link rel="stylesheet" href="./assets/css/section-ingrediants.css?v=20251023-0727">
  <link rel="stylesheet" href="./assets/css/section-recommend.css?v=20251023-0727">
  <link rel="stylesheet" href="./assets/css/custom.css?v=20251023-0727">
  <link rel="stylesheet" href="./assets/css/theme-yadon.css?v=20251023-0727">
  <link rel="manifest" href="./manifest.json">
  <!--<meta name="theme-color" content="#fdeef4">*/-->
</head>
<body>
  <main class="container">
    <div class="version-info">
      現在のバージョン: <span id="appVersion">-</span>
    </div>

    <!-- タブナビ -->
    <nav class="tabs" role="tablist" aria-label="期間切替">
      <button type="button" class="tab is-active" data-tab="this" aria-selected="true">食材バッグ管理</button>
      <button type="button" class="tab" data-tab="next" aria-selected="false">料理エナジー計算</button>
      <button type="button" class="tab" data-tab="gather" aria-selected="false">食材集め能力</button>
    </nav>

    <!-- ▼ 今週タブ（メインタブ） -->
    <section id="tab_this_week" class="tab-panel is-active">

      <!-- OCR入力 -->
      <section class="section">
        <header class="section-header">
          <span class="dot dot-green"></span>
          <h2 class="section-title">OCRから食材バッグを更新</h2>
        </header>

        <div class="card">
          <textarea id="ocrInput" class="textarea" placeholder="Paste OCR text here..."></textarea>
          <div class="row row-gap">
            <button id="parseBtn" class="btn btn-primary">OCR解析を実行</button>
            <button id="clearDataBtn" class="btn btn-ghost">バッグ情報をリセット</button>
          </div>
          <p class="hint">入力内容はブラウザのローカルストレージに自動保存されます。</p>
        </div>
      </section>

      <!-- ② 今週の目標料理を追加 -->
      <section class="section">
        <header class="section-header">
          <span class="dot dot-green"></span>
          <h2 class="section-title">食材バッグに合わせて料理を追加</h2>
          <button class="collapse-toggle" data-target="#panel_this_week" aria-expanded="true">表示/非表示</button>
        </header>

        <div id="panel_this_week" class="card">
          <div class="form-row">
            <label class="label" for="categorySelect">今週の料理：</label>
            <select id="categorySelect" class="select"></select>
          </div>
          <div class="form-row end">
            <select id="recipeSelect" class="select select-wide"></select>
          </div>
          <div id="menuList" class="menu-list"></div>
        </div>
      </section>


      <!-- 次週の目標料理を追加 -->
      <section class="section">
        <header class="section-header">
          <span class="dot dot-green"></span>
          <h2 class="section-title">次週の計画</h2>
          <button class="collapse-toggle" data-target="#panel_next_week" aria-expanded="false">表示/非表示</button>
        </header>
        <div id="panel_next_week" class="card">
          <!-- カレー・シチュー -->
          <div class="form-row">
            <label class="label" for="nwRecCurry">カレー・シチュー：</label>
            <select id="nwRecCurry" class="select select-wide"></select>
          </div>
          <div id="nwListCurry" class="menu-list"></div>

          <!-- サラダ -->
          <div class="form-row mt-md">
            <label class="label" for="nwRecSalad">サラダ：</label>
            <select id="nwRecSalad" class="select select-wide"></select>
          </div>
          <div id="nwListSalad" class="menu-list"></div>

          <!-- デザート・ドリンク -->
          <div class="form-row mt-md">
            <label class="label" for="nwRecSweets">デザート・ドリンク：</label>
            <select id="nwRecSweets" class="select select-wide"></select>
          </div>
          <div id="nwListSweets" class="menu-list"></div>

          <!-- 個別食材（現在非表示。復活時は以下のブロックを戻す）
          <div class="form-row mt-lg">
            <label class="label" for="nwExtraSelect">個別食材：</label>
            <select id="nwExtraSelect" class="select select-wide"></select>
          </div>
          <div id="nwExtraList" class="menu-list"></div>
          -->
        </div>
      </section>


      <!-- 食材一覧 -->
      <section class="section">
        <header class="section-header">
          <span class="dot dot-green"></span>
          <h2 class="section-title">食材バッグ一覧</h2>
          <div class="table-filters">
            <label><input type="checkbox" id="chkThisWeek" checked> 今週</label>
            <label><input type="checkbox" id="chkNextWeek"> 次週</label>
          </div>
        </header>

        <div class="card">
          <h3 class="sub-title">目標料理の使用食材</h3>
          <div class="table-wrapper">
            <table id="usedTable" class="table"></table>
          </div>

          <h3 class="sub-title mt-lg">その他の食材</h3>
          <div class="table-wrapper">
            <table id="otherTable" class="table"></table>
          </div>
        </div>
      </section>


      <!-- おすすめレシピ -->
      <section class="section">
        <header class="section-header">
          <span class="dot dot-green"></span>
          <h2 class="section-title">おすすめレシピ（未選択・今週の料理）</h2>
        </header>

        <div class="card">
          <div class="table-wrapper">
            <table id="recommendTable" class="table table-recipe"></table>
          </div>
        </div>
      </section>

    </section> <!-- ← 今週タブをここで閉じる -->

    <!-- ▼ 料理エナジー計算タブ -->
    <section id="tab_next_week" class="tab-panel" hidden>
      <section class="section">
        <header class="section-header">
          <span class="dot dot-green"></span>
          <h2 class="section-title">料理エナジー計算</h2>
        </header>
        <div class="card">
          <div class="energy-controls">
            <label class="control">
              <span>フィールドボーナス（%）</span>
              <input type="number" id="fieldBonusInput" class="input" min="0" max="999" step="1">
            </label>
            <label class="control">
              <span>イベントボーナス（倍率）</span>
              <input type="number" id="eventBonusInput" class="input" min="0" step="0.01">
            </label>
          </div>
          <div class="energy-meta">
            表示カテゴリ: <span id="energyCategoryLabel">-</span>
          </div>
          <div class="table-wrapper">
            <table id="energyTable" class="table table-energy"></table>
          </div>
          <p class="muted footnote">レシピレベルは 0〜65 の範囲で設定できます。フィールド／イベントボーナスは全レシピに共通で適用されます。</p>
        </div>
      </section>
    </section>

    <!-- ▼ 食材集め能力タブ -->
    <section id="tab_gather" class="tab-panel" hidden>
      <section class="section">
        <header class="section-header">
          <span class="dot dot-green"></span>
          <h2 class="section-title">食材集め能力（24hあたり）</h2>
        </header>
        <div class="card">
          <p class="muted">各食材が24時間で集められる個数を記録します。食材タイプ・きのみポケ・その他常駐の3枠を入力してください。</p>
          <div class="table-wrapper">
            <table id="gatherTable" class="table table-gather"></table>
          </div>
          <div class="proposal-actions">
            <label class="control control-inline">
              <span class="control-label">食材ポケモン数</span>
              <input type="number" id="gatherPokemonCount" class="input" min="1" max="3" step="1">
            </label>
            <label class="control control-inline">
              <span class="control-label">鍋容量</span>
              <input type="number" id="potCapacityInput" class="input" min="1" step="1" value="200">
            </label>
            <label class="check-inline">
              <input type="checkbox" id="excludeMaxLevelCheckbox">
              レシピレベルMaxの料理は作らない
            </label>
            <label class="check-inline">
              <input type="checkbox" id="excludeOverPotCheckbox">
              食材合計が鍋容量を超える料理は作らない
            </label>
            <button type="button" id="calcRecipeProposalsBtn" class="btn btn-primary">料理提案を計算</button>
          </div>
          <div id="proposalResults" class="proposal-results"></div>
        </div>
      </section>
    </section>

  </main>
  <script src="./js/main.js?v=20251023-0727" type="module"></script>
  <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js")
        .then(() => console.log("Service Worker registered"))
        .catch((err) => console.error("SW registration failed:", err));
    });
  }
</script>
</body>
</html>
